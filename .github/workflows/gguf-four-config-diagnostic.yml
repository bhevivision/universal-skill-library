name: Diagnostica GGUF - quattro configurazioni con risposte progressive

on:
  pull_request:
    branches:
      - fix/gguf-constrained-decoding-probe-v1
  push:
    branches:
      - diagnostics/gguf-streaming-four-configs-v1
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Limite massimo per singola richiesta (secondi)
        required: true
        default: "120"
        type: string
      max_tokens:
        description: Numero massimo di token generati per richiesta
        required: true
        default: "2048"
        type: string

permissions:
  contents: read

jobs:
  compare-four-configurations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/gguf-streaming-four-configs-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependency
        run: python -m pip install --no-cache-dir jsonschema

      - name: Run focused diagnostic tests
        run: python -m unittest discover -s tests -p "test_gguf_four_config_diagnostic.py" -v

      - name: Download exact GGUF model
        run: |
          set -euo pipefail
          mkdir -p models output
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 900 "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf" --output models/qwen2.5-3b-instruct-q4_k_m.gguf
          test "$(stat -c%s models/qwen2.5-3b-instruct-q4_k_m.gguf)" -gt 1800000000
          sha256sum models/qwen2.5-3b-instruct-q4_k_m.gguf | tee model-sha256.txt

      - name: Build isolated evaluation client
        run: |
          docker build -t gguf-four-config-client -f- /tmp <<'EOF'
          FROM python:3.12-slim
          RUN python -m pip install --no-cache-dir jsonschema
          EOF

      - name: Pull official llama.cpp server
        run: docker pull ghcr.io/ggml-org/llama.cpp:server

      - name: Start isolated model server
        run: |
          set -euo pipefail
          docker network create --internal gguf-diagnostic-network
          docker run -d --name gguf-diagnostic-model --network gguf-diagnostic-network \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 5g --memory-swap 5g --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            --mount type=bind,src="$GITHUB_WORKSPACE/models",dst=/models,readonly \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/qwen2.5-3b-instruct-q4_k_m.gguf \
            --host 127.0.0.1 --port 8080 --ctx-size 4096 \
            --threads 2 --threads-batch 2 --parallel 1 --n-predict 2048
          docker inspect gguf-diagnostic-model --format '{{json .HostConfig}}' > docker-security-config.json
          docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{json .RepoDigests}}' > llama-image-digests.json
          docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{json .Config.Labels}}' > llama-image-labels.json

      - name: Wait for model and execute 16 isolated requests
        run: |
          set -euo pipefail
          mkdir -p output/gguf-four-configs
          docker run --name gguf-four-config-evaluator \
            --network container:gguf-diagnostic-model \
            --user "$(id -u):$(id -g)" \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 32 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/output",dst=/output \
            --workdir /workspace --env PYTHONPATH=/workspace \
            gguf-four-config-client python -c 'import time, urllib.request, subprocess
          from pathlib import Path
          out=Path("/output/gguf-four-configs")
          out.mkdir(parents=True, exist_ok=True)
          probe=out/".write-test"
          probe.write_text("ok", encoding="utf-8")
          probe.unlink()
          ready=False
          for attempt in range(120):
              try:
                  response=urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)
                  ready=response.status == 200
                  if ready: break
              except Exception:
                  time.sleep(2)
          if not ready: raise SystemExit("Il modello GGUF non è diventato disponibile entro 240 secondi.")
          subprocess.run([
              "python", "/workspace/scripts/gguf_four_config_diagnostic.py",
              "--base-url", "http://127.0.0.1:8080",
              "--output-dir", "/output/gguf-four-configs",
              "--timeout-seconds", "${{ inputs.timeout_seconds || '120' }}",
              "--max-tokens", "${{ inputs.max_tokens || '2048' }}"
          ], check=True, timeout=6600)'

      - name: Collect logs and stop isolated containers
        if: always()
        run: |
          docker rm --force gguf-four-config-evaluator || true
          if docker inspect gguf-diagnostic-model >/dev/null 2>&1; then
            docker inspect gguf-diagnostic-model --format 'Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' > model-runtime-status.txt || true
            docker logs gguf-diagnostic-model > llama-server.log 2>&1 || true
            docker rm --force gguf-diagnostic-model || true
          fi
          docker network rm gguf-diagnostic-network || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gguf-four-config-progressive-diagnostic
          path: |
            output/gguf-four-configs/
            model-sha256.txt
            docker-security-config.json
            llama-image-digests.json
            llama-image-labels.json
            model-runtime-status.txt
            llama-server.log
          if-no-files-found: warn
          retention-days: 30
