name: Validate skill library

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa la dipendenza di verifica
        run: python -m pip install -r requirements-dev.txt
      - name: Esegue i test
        run: python -m unittest discover -s tests -v
      - name: Controlla la libreria
        run: python scripts/validate_library.py
