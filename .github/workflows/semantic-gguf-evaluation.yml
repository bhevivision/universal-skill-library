name: Valutazione modello GGUF isolato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gguf-evaluation:
    name: Inferenza reale e valutazione semantica
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze di valutazione
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Scarica il modello GGUF noto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
            --output models/qwen2.5-0.5b-instruct-q4_k_m.gguf
          test "$(stat -c%s models/qwen2.5-0.5b-instruct-q4_k_m.gguf)" -gt 100000000
          sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee model-sha256.txt
      - name: Scarica immagine ufficiale llama.cpp
        run: docker pull ghcr.io/ggml-org/llama.cpp:server
      - name: Crea rete Docker interna senza accesso esterno
        run: docker network create --internal semantic-model-isolated
      - name: Avvia il modello con limiti e privilegi minimi
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name semantic-llama-server \
            --network semantic-model-isolated \
            --publish 127.0.0.1:8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 5g --memory-swap 5g --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            --mount type=bind,src="$GITHUB_WORKSPACE/models",dst=/models,readonly \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            --host 0.0.0.0 --port 8080 --ctx-size 4096 \
            --threads 2 --threads-batch 2 --n-predict 1024
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then break; fi
            if [ "$attempt" -eq 90 ]; then docker logs semantic-llama-server; exit 1; fi
            sleep 2
          done
          docker inspect semantic-llama-server --format '{{json .HostConfig}}' > docker-security-config.json
          docker image inspect ghcr.io/ggml-org/llama.cpp:server --format '{{json .RepoDigests}}' > llama-image-digests.json
      - name: Esegue inferenza reale e valuta i campioni
        run: python scripts/semantic_evaluation.py
      - name: Verifica isolamento e limiti, poi arresta il contenitore
        if: always()
        shell: bash
        run: |
          if docker inspect semantic-llama-server >/dev/null 2>&1; then
            docker inspect semantic-llama-server --format 'Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}'
            docker stats --no-stream semantic-llama-server || true
            docker logs semantic-llama-server > llama-server.log 2>&1 || true
            docker rm --force semantic-llama-server || true
          fi
          docker network rm semantic-model-isolated || true
      - name: Carica rapporto, configurazione e registri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-gguf-evaluation
          path: |
            semantic-evaluation-report.json
            model-sha256.txt
            docker-security-config.json
            llama-image-digests.json
            llama-server.log
          if-no-files-found: warn
          retention-days: 30
